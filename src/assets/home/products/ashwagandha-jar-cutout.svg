<svg width="500" height="760" viewBox="0 0 500 760" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Glass jar body -->
    <linearGradient id="ashGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1610"/>
      <stop offset="16%" stop-color="#1c2f22"/>
      <stop offset="38%" stop-color="#26402e"/>
      <stop offset="55%" stop-color="#18291d"/>
      <stop offset="78%" stop-color="#0e1b13"/>
      <stop offset="100%" stop-color="#060d09"/>
    </linearGradient>

    <!-- Gold lid -->
    <linearGradient id="ashLidTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4e3b8"/>
      <stop offset="22%" stop-color="#d9b872"/>
      <stop offset="45%" stop-color="#b08d57"/>
      <stop offset="65%" stop-color="#8a6a3c"/>
      <stop offset="100%" stop-color="#5f4726"/>
    </linearGradient>

    <linearGradient id="ashLidSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e5330"/>
      <stop offset="15%" stop-color="#caa565"/>
      <stop offset="30%" stop-color="#f4e3b8"/>
      <stop offset="50%" stop-color="#b08d57"/>
      <stop offset="70%" stop-color="#8a6a3c"/>
      <stop offset="88%" stop-color="#dcc186"/>
      <stop offset="100%" stop-color="#5f4726"/>
    </linearGradient>

    <!-- Ivory label -->
    <linearGradient id="ashLabel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf6ed"/>
      <stop offset="100%" stop-color="#ece2cc"/>
    </linearGradient>

    <linearGradient id="ashStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cba876"/>
      <stop offset="100%" stop-color="#8a6a3c"/>
    </linearGradient>

    <radialGradient id="ashShine" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="ashDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#ashDrop)">
    <!-- Lid band (cylinder side) -->
    <rect x="150" y="60" width="200" height="70" rx="10" fill="url(#ashLidSide)"/>
    <!-- Lid top ellipse -->
    <ellipse cx="250" cy="60" rx="100" ry="26" fill="url(#ashLidTop)"/>
    <ellipse cx="250" cy="58" rx="88" ry="19" fill="none" stroke="#5f4726" stroke-width="2" opacity="0.5"/>
    <!-- Lid ribbing lines -->
    <g stroke="#5f4726" stroke-width="2" opacity="0.35">
      <line x1="162" y1="80" x2="162" y2="122"/>
      <line x1="185" y1="86" x2="185" y2="128"/>
      <line x1="208" y1="90" x2="208" y2="130"/>
      <line x1="292" y1="90" x2="292" y2="130"/>
      <line x1="315" y1="86" x2="315" y2="128"/>
      <line x1="338" y1="80" x2="338" y2="122"/>
    </g>

    <!-- Jar neck -->
    <path d="M 168 122 L 332 122 L 322 168 L 178 168 Z" fill="url(#ashGlass)"/>

    <!-- Jar body -->
    <path d="M 122 168
             L 378 168
             Q 392 168 392 190
             L 392 560
             Q 392 620 250 620
             Q 108 620 108 560
             L 108 190
             Q 108 168 122 168 Z"
          fill="url(#ashGlass)"/>

    <!-- Glass shine overlay -->
    <path d="M 122 168
             L 378 168
             Q 392 168 392 190
             L 392 560
             Q 392 620 250 620
             Q 108 620 108 560
             L 108 190
             Q 108 168 122 168 Z"
          fill="url(#ashShine)"/>

    <!-- Vertical side stripe (right), echoes Shilajit jar's vertical text panel -->
    <rect x="352" y="270" width="30" height="300" rx="4" fill="url(#ashStripe)" opacity="0.9"/>
    <text x="367" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700"
          fill="#2a1f10" text-anchor="middle"
          transform="rotate(-90 367 420)">AYURVEDIC ROOT EXTRACT</text>

    <!-- Front label -->
    <rect x="128" y="270" width="210" height="300" rx="6" fill="url(#ashLabel)" stroke="#b08d57" stroke-width="2"/>

    <!-- Small leaf glyph -->
    <path d="M 233 292 C 245 292 253 302 253 314 C 241 314 233 306 233 292 Z" fill="#26402e"/>
    <path d="M 233 314 L 233 292" stroke="#26402e" stroke-width="2"/>

    <!-- Brand -->
    <text x="233" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700"
          fill="#142a1f" text-anchor="middle" letter-spacing="1">ABIXMART</text>
    <text x="233" y="356" font-family="Arial, sans-serif" font-size="9" font-weight="600"
          fill="#5f4726" text-anchor="middle" letter-spacing="2">AYURVEDIC WELLNESS</text>

    <line x1="158" y1="370" x2="308" y2="370" stroke="#b08d57" stroke-width="1"/>

    <text x="233" y="392" font-family="Arial, sans-serif" font-size="9" font-weight="700"
          fill="#8a6a3c" text-anchor="middle" letter-spacing="1.5">PURE • NATURAL • EFFECTIVE</text>

    <!-- Product name -->
    <text x="233" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600"
          fill="#26402e" text-anchor="middle" letter-spacing="0.5">ORGANIC INDIAN</text>
    <text x="233" y="486" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700"
          fill="#142a1f" text-anchor="middle">Ashwagandha</text>
    <text x="233" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="16" italic="true" font-style="italic"
          fill="#5f4726" text-anchor="middle">Root Powder</text>

    <line x1="158" y1="528" x2="308" y2="528" stroke="#b08d57" stroke-width="1"/>

    <text x="158" y="552" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#142a1f">Net Wt.</text>
    <text x="158" y="566" font-family="Arial, sans-serif" font-size="11" fill="#142a1f">100 g</text>
    <text x="308" y="560" font-family="Arial, sans-serif" font-size="10" fill="#5f4726" text-anchor="end">Calm Mind &amp; Body</text>

    <!-- Bottom glass rim highlight -->
    <ellipse cx="250" cy="615" rx="140" ry="14" fill="#000000" opacity="0.25"/>
  </g>
</svg>
