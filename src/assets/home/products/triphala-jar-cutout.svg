<svg width="500" height="760" viewBox="0 0 500 760" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Glass jar body — slightly warmer/deeper tone than Ashwagandha jar -->
    <linearGradient id="triGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#140d08"/>
      <stop offset="16%" stop-color="#2c1d10"/>
      <stop offset="38%" stop-color="#3e2a16"/>
      <stop offset="55%" stop-color="#25190e"/>
      <stop offset="78%" stop-color="#150e07"/>
      <stop offset="100%" stop-color="#0a0603"/>
    </linearGradient>

    <linearGradient id="triLidTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4e3b8"/>
      <stop offset="22%" stop-color="#d9b872"/>
      <stop offset="45%" stop-color="#b08d57"/>
      <stop offset="65%" stop-color="#8a6a3c"/>
      <stop offset="100%" stop-color="#5f4726"/>
    </linearGradient>

    <linearGradient id="triLidSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e5330"/>
      <stop offset="15%" stop-color="#caa565"/>
      <stop offset="30%" stop-color="#f4e3b8"/>
      <stop offset="50%" stop-color="#b08d57"/>
      <stop offset="70%" stop-color="#8a6a3c"/>
      <stop offset="88%" stop-color="#dcc186"/>
      <stop offset="100%" stop-color="#5f4726"/>
    </linearGradient>

    <linearGradient id="triLabel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf6ed"/>
      <stop offset="100%" stop-color="#ece2cc"/>
    </linearGradient>

    <linearGradient id="triStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cba876"/>
      <stop offset="100%" stop-color="#8a6a3c"/>
    </linearGradient>

    <radialGradient id="triShine" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="triDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#triDrop)">
    <!-- Lid band -->
    <rect x="150" y="60" width="200" height="70" rx="10" fill="url(#triLidSide)"/>
    <ellipse cx="250" cy="60" rx="100" ry="26" fill="url(#triLidTop)"/>
    <ellipse cx="250" cy="58" rx="88" ry="19" fill="none" stroke="#5f4726" stroke-width="2" opacity="0.5"/>
    <g stroke="#5f4726" stroke-width="2" opacity="0.35">
      <line x1="162" y1="80" x2="162" y2="122"/>
      <line x1="185" y1="86" x2="185" y2="128"/>
      <line x1="208" y1="90" x2="208" y2="130"/>
      <line x1="292" y1="90" x2="292" y2="130"/>
      <line x1="315" y1="86" x2="315" y2="128"/>
      <line x1="338" y1="80" x2="338" y2="122"/>
    </g>

    <!-- Neck -->
    <path d="M 168 122 L 332 122 L 322 168 L 178 168 Z" fill="url(#triGlass)"/>

    <!-- Body -->
    <path d="M 122 168
             L 378 168
             Q 392 168 392 190
             L 392 560
             Q 392 620 250 620
             Q 108 620 108 560
             L 108 190
             Q 108 168 122 168 Z"
          fill="url(#triGlass)"/>

    <path d="M 122 168
             L 378 168
             Q 392 168 392 190
             L 392 560
             Q 392 620 250 620
             Q 108 620 108 560
             L 108 190
             Q 108 168 122 168 Z"
          fill="url(#triShine)"/>

    <!-- Vertical side stripe -->
    <rect x="352" y="270" width="30" height="300" rx="4" fill="url(#triStripe)" opacity="0.9"/>
    <text x="367" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700"
          fill="#2a1f10" text-anchor="middle"
          transform="rotate(-90 367 420)">THREE FRUIT HERBAL BLEND</text>

    <!-- Front label -->
    <rect x="128" y="270" width="210" height="300" rx="6" fill="url(#triLabel)" stroke="#b08d57" stroke-width="2"/>

    <!-- Small berry/fruit glyph (three dots for "tri") -->
    <circle cx="222" cy="304" r="7" fill="#8a6a3c"/>
    <circle cx="240" cy="298" r="7" fill="#5f4726"/>
    <circle cx="252" cy="308" r="7" fill="#3e2a16"/>

    <!-- Brand -->
    <text x="233" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700"
          fill="#3e2a16" text-anchor="middle" letter-spacing="1">ABIXMART</text>
    <text x="233" y="356" font-family="Arial, sans-serif" font-size="9" font-weight="600"
          fill="#5f4726" text-anchor="middle" letter-spacing="2">AYURVEDIC WELLNESS</text>

    <line x1="158" y1="370" x2="308" y2="370" stroke="#b08d57" stroke-width="1"/>

    <text x="233" y="392" font-family="Arial, sans-serif" font-size="9" font-weight="700"
          fill="#8a6a3c" text-anchor="middle" letter-spacing="1.5">PURE • NATURAL • EFFECTIVE</text>

    <!-- Product name -->
    <text x="233" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600"
          fill="#5f4726" text-anchor="middle" letter-spacing="0.5">CLASSIC AYURVEDIC</text>
    <text x="233" y="486" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700"
          fill="#3e2a16" text-anchor="middle">Triphala</text>
    <text x="233" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic"
          fill="#5f4726" text-anchor="middle">Herbal Powder</text>

    <line x1="158" y1="528" x2="308" y2="528" stroke="#b08d57" stroke-width="1"/>

    <text x="158" y="552" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#3e2a16">Net Wt.</text>
    <text x="158" y="566" font-family="Arial, sans-serif" font-size="11" fill="#3e2a16">100 g</text>
    <text x="308" y="560" font-family="Arial, sans-serif" font-size="10" fill="#5f4726" text-anchor="end">Gentle Daily Detox</text>

    <!-- Bottom rim shadow -->
    <ellipse cx="250" cy="615" rx="140" ry="14" fill="#000000" opacity="0.25"/>
  </g>
</svg>
